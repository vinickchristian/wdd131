<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product Review Form">
    <meta name="author" content="Miamo Siedjouwa">
    <title>Product Review</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;400&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <h1>Product Review</h1>
  </header>  
  <main>
    <form method="get" action="review.html">
      <fieldset>
        <legend>Review a Product</legend>
        
        <label for="productName">Product Name</label>
        <select id="productName" name="productName" required>
          <option value="" disabled selected>Select a Product ...</option>
        </select>
        
        <label>Overall Rating</label>
        <div>
          <input type="radio" id="rating1" name="rating" value="1" required>
          <label for="rating1">1 &starf;</label>
          <input type="radio" id="rating2" name="rating" value="2">
          <label for="rating2">2 &starf;&starf;</label>
          <input type="radio" id="rating3" name="rating" value="3">
          <label for="rating3">3 &starf;&starf;&starf;</label>
          <input type="radio" id="rating4" name="rating" value="4">
          <label for="rating4">4 &starf;&starf;&starf;&starf;</label>
          <input type="radio" id="rating5" name="rating" value="5">
          <label for="rating5">5 &starf;&starf;&starf;&starf;&starf;</label>
        </div>
        
        <label for="installationDate">Date of Installation</label>
        <input type="date" id="installationDate" name="installationDate" required>
        
        <label>Which features did you find useful in the product? <br><small>(Check all that apply)</small></label>
        <div>
          <input type="checkbox" id="durability" name="usefulFeatures" value="durability">
          <label for="durability">Durability</label>
          <input type="checkbox" id="easeOfUse" name="usefulFeatures" value="easeOfUse">
          <label for="easeOfUse">Ease of Use</label>
          <input type="checkbox" id="performance" name="usefulFeatures" value="performance">
          <label for="performance">Performance</label>
          <input type="checkbox" id="design" name="usefulFeatures" value="design">
          <label for="design">Design</label>
        </div>
        
        <label for="reviewText">Written Review <small>(Optional)</small></label>
        <textarea id="reviewText" name="reviewText"></textarea>
        
        <label for="userName">Your Name <small>(Optional)</small></label>
        <input type="text" id="userName" name="userName">
        
        <input type="submit" value="Post Review">
      </fieldset>
    </form>
  </main>
  <footer>
    <p>&copy; 2024 🌸 Miamo Siedjouwa Vinick 🌸 Cameroon</p>
    <p>Last Modification: <span id="lastModified"></span></p>
  </footer>
</body>
</html>
